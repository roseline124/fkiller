name: Slack bug auto-fix (AI PR)

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Supabase fix_requests.id
        required: false
      repo:
        description: 레포 이름 / 식별자 (메타)
        required: false
      slack_channel_id:
        description: Slack channel ID
        required: false
      slack_thread_ts:
        description: Slack thread ts
        required: false
      title:
        description: 버그 제목
        required: true
      error_summary:
        description: 에러 요약 또는 스택
        required: true
      reproduction_steps:
        description: 재현 단계
        required: false
      expected_behavior:
        description: 기대 동작
        required: false
      allowed_file_patterns:
        description: 수정 허용 glob JSON 배열 (선택)
        required: false
      blocked_file_patterns:
        description: 추가 차단 glob JSON 배열 (선택)
        required: false
      environment_url:
        description: Context Routing — 배포 URL
        required: false
      environment_name:
        description: Context Routing — 배포 이름
        required: false
      context_dictionary_json:
        description: Routing JSON 문자열 (비어 있지 않으면 파일보다 우선)
        required: false
      context_dictionary_path:
        description: 컨텍스트 JSON 경로 (repo 루트 기준, 기본값 액션과 동일)
        required: false
      max_context_files:
        description: AI에 전달할 후보 파일 수 (5–20)
        required: false
      max_changed_files:
        description: 패치 허용 최대 수정 파일 수 (1–20)
        required: false
      language:
        description: AI 신규 인라인 주석용 locale (예 ko/en/ja-JP)
        required: false

jobs:
  auto_fix:
    runs-on: ubuntu-latest
    concurrency:
      group: slack-auto-fix-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: ./
        with:
          title: ${{ github.event.inputs.title }}
          error_summary: ${{ github.event.inputs.error_summary }}
          reproduction_steps: ${{ github.event.inputs.reproduction_steps }}
          expected_behavior: ${{ github.event.inputs.expected_behavior }}
          environment_url: ${{ github.event.inputs.environment_url }}
          environment_name: ${{ github.event.inputs.environment_name }}
          allowed_file_patterns: ${{ github.event.inputs.allowed_file_patterns }}
          blocked_file_patterns: ${{ github.event.inputs.blocked_file_patterns }}
          max_changed_files: ${{ github.event.inputs.max_changed_files }}
          max_context_files: ${{ github.event.inputs.max_context_files }}
          language: ${{ github.event.inputs.language }}
          request_id: ${{ github.event.inputs.request_id }}
          repo: ${{ github.event.inputs.repo }}
          slack_channel_id: ${{ github.event.inputs.slack_channel_id }}
          slack_thread_ts: ${{ github.event.inputs.slack_thread_ts }}
          context_dictionary_path: ${{ github.event.inputs.context_dictionary_path }}
          context_dictionary_json: ${{ github.event.inputs.context_dictionary_json }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-auto-fix-report-${{ github.run_id }}
          path: slack-auto-fix-report.json
